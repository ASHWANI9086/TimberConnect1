const ls=shown().map(l=>`<div class="lc" onclick="shp=null;sel=${l.id};draw()">${rings(l.sp,l.g,54)}<div><h3>${sn(l.sp)}<span class="pill">${l.g}</span></h3><div class="mu">${esc(l.seller)} · ${esc(l.city)}</div><div class="mu">${near(l)} · ${l.qty} cft</div>${deal(l)}</div><div class="pz big">${fmt(l.price)}<div class="mu">/cft</div></div></div>`).join('')||`<p class="mu">${t('nl')}</p>`;
$('#ls').innerHTML=`<h3 style="margin:14px 4px 4px">${t('fs')}</h3>${ls}<h3 style="margin:18px 4px 4px">${t('shops2')}</h3>${my.map(shopCard).join('')||`<p class="mu">${t('nv')}</p>`}`}
function shopView(){const s=SH[shp],tel=s[3].replace(/\s/g,''),wa=/^\+91 [6-9]\d{4} \d{5}$/.test(s[3]);
return `<button class="btn o" onclick="shp=null;draw()">${t('back')}</button><div class="c"><h3>${s[0]}</h3><div class="mu">${t('k'+s[8])} · ⭐ ${s[5].toFixed(1)} (${s[6]})</div><p>📍 ${s[2]}<br>🕘 ${s[4]}<br>📞 ${s[3]}</p><a class="btn" href="tel:${tel}">📞 ${t('call')}</a><div class="r">${wa?`<a class="btn w" target="_blank" rel="noopener" href="https://wa.me/${tel.slice(1)}">${t('wa')}</a>`:''}<a class="btn o" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s[9]},${s[10]}&destination_place_id=${s[7]}">${t('dr')}</a></div><a class="btn o" target="_blank" rel="noopener" href="https://www.google.com/maps/place/?q=place_id:${s[7]}">🗺 ${t('mp')}</a></div>
${wa?`<div class="c"><b>${t('rq')}</b><label>${t('type')}</label><select id="rt">${opt(SP,sn)}</select><label>${t('need')}</label><input id="rn" type="number" value="50" inputmode="numeric"><a class="btn w" id="rl" target="_blank" rel="noopener" href="#" onclick="rqk(${shp})">${t('sw')}</a></div>`:''}`}
function rqk(i){const s=SH[i],m=`Hello, I found your shop on TimberConnect. I need ${$('#rn').value||'some'} cft ${SP[$('#rt').value]?$('#rt').value:''} timber${me.di?' in '+me.di:''}. Please share your rate and availability.`;$('#rl').href='https://wa.me/'+s[3].replace(/[^\d]/g,'')+'?text='+encodeURIComponent(m)}
function detail(){const l=L.find(x=>x.id==sel);if(!l){sel=null;return market()}const f=fair(l.sp,l.g,l.st);
return `<button class="btn o" onclick="sel=null;draw()">${t('back')}</button><div class="c"><div class="r" style="align-items:center;flex:none"><div style="flex:0 0 84px">${rings(l.sp,l.g,80)}</div><div><h3>${sn(l.sp)}<span class="pill">${gname(l.g)}</span></h3><div class="big">${fmt(l.price)}<span class="mu">/cft</span></div></div></div><p>${esc(l.note)}</p><p>${deal(l)} <span class="mu">(≈ ${fmt(f)}/cft)</span></p><div class="mu">${l.qty} cft · ${near(l)}</div>
<h3 style="margin-top:12px">${esc(l.seller)}</h3><p class="mu">📍 ${l.addr?esc(l.addr)+', ':''}${esc(l.city)}, ${esc(l.st)}<br>${t('ps')}: ${new Date(l.ts||l.id).toLocaleDateString()}<br>📞 +91 ${esc(l.ph)}</p>
<a class="btn" href="tel:+91${l.ph}">📞 ${t('call')}</a><div class="r"><a class="btn w" target="_blank" rel="noopener" href="https://wa.me/91${l.ph}">${t('wa')}</a><a class="btn o" href="sms:+91${l.ph}">${t('sm')}</a></div><a class="btn o" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent((l.addr||'')+' '+l.city+' '+l.st)}">🗺 ${t('mp')}</a></div>
<div class="c"><b>${t('hg')}</b><div class="hb"><u id="hu"></u><s style="left:${Math.max(0,Math.min(100,(f/l.price*100-60)/50*100))}%">${t('mk')}</s><s style="left:80%">${t('ak')}</s></div><input type="range" id="hr" min="60" max="110" value="90" oninput="hag(${l.id})"><div id="hv"></div><label>${t('qty')}</label><input id="nq" type="number" value="50" oninput="hag(${l.id})"><button class="btn" onclick="ord(${l.id})">${t('order')}</button><div id="od"></div></div>`}
function ord(i){const l=L.find(x=>x.id==i),n=+$('#nq').value,p=l.price*$('#hr').value/100;if(!n||n>l.qty){$('#od').innerHTML=`<span class="no">${t('qerr')} ${l.qty}</span>`;return}
const m=`Hello ${l.seller}, I found your ${l.sp} (grade ${l.g}) listing on TimberConnect. I want ${n} cft at ${fmt(p)}/cft (about ${fmt(n*p)}). Is it available?`;$('#od').innerHTML=`<a class="btn w" target="_blank" rel="noopener" href="https://wa.me/91${l.ph}?text=${encodeURIComponent(m)}">${t('sw')}</a>`}
async function add(){const p=+$('#sp').value,q2=+$('#sq').value,n=$('#sn').value.trim().slice(0,80),h=$('#sh').value.replace(/\D/g,'').slice(-10);if(!(p>0&&p<1e6)||!(q2>0)||!n||h.length!=10||!me.di){$('#so').innerHTML=`<span class="no">${t('fill')}</span>`;return}
const s=$('#ss').value,g=$('#sg').value,l={id:Date.now(),sp:s,g,price:p,qty:q2,seller:n,city:me.di,st:me.st,ph:h,addr:$('#sa').value.trim().slice(0,120),note:($('#sd').value||'-').slice(0,120),ts:Date.now()};L.unshift(l);save();
$('#so').innerHTML=`<div class="stamp">TIMBER<br>CONNECT<br>✓ ${esc(n)}</div><p class="mu" style="text-align:center">…</p>`;const live=cloudOn()&&await cloudAdd(l);
$('#so').innerHTML=`<div class="stamp">TIMBER<br>CONNECT<br>✓ ${esc(n)}</div><p class="ok" style="text-align:center">${t('sd')}<br><span class="mu">${t('done')} ${fmt(fair(s,g,me.st))}/cft</span></p><p class="${live?'ok':'mu'}" style="text-align:center">${live?t('lc'):t('lm')}</p>`}
function draw(){$('#tg').textContent=t('tag');$('#lo').innerHTML=rings('Teak','A',38);$('#lg').innerHTML=['EN','हिं','ਪੰ'].map((x,i)=>`<button class="${i==lang?'on':''}" onclick="setL(${i})">${x}</button>`).join('');
$('#n').innerHTML=[[0,1],[0,6],[0,2],[0,3],[0,4],[0,5]].map(x=>`<button class="${tab==x[1]?'on':''}" onclick="navigator.vibrate&&navigator.vibrate(8);tab=${x[1]};sel=null;shp=null;draw()"><i>${IC[x[1]]}</i>${t('n'+x[1])}</button>`).join('');
$('#m').innerHTML=shp!=null?shopView():sel?detail():[market,helper,rate,calc,sell,shops][tab-1]();if(shp==null&&!sel){if(tab==1)fill();if(tab==4)cc();if(tab==6)shl()}if(shp==null&&sel)hag(sel);window.scrollTo(0,0)}
draw();cloudLoad();setInterval(cloudLoad,60000);$('#spl').innerHTML=rings('Teak','A',104);setTimeout(()=>$('#splash').classList.add('x'),750);setTimeout(()=>$('#splash').remove(),1150);
</script></body></html>
